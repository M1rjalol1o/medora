[project]
name = "medora"
version = "1.0.0"
description = "Medora — dori qidiruvi, bashorat, yetkazish va retsept platformasi"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<6.0",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-cors-headers>=4.3",
  "drf-spectacular>=0.27",
  "Pillow>=10.0",
  "psycopg[binary]>=3.1",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"
